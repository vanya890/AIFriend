name: AIFriend Tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-message-tests.yml"
      - "src/**"
      - "tests/**"
      - "package.json"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/private-message-tests.yml"
      - "src/**"
      - "tests/**"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: npm run check
      - name: Run tests
        run: npm test
