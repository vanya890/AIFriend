name: ChatGPT Telegram Command Bridge

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

concurrency:
  group: aifriend-runtime-context
  cancel-in-progress: false

jobs:
  execute:
    if: startsWith(github.event.issue.title, '[aifriend]') && github.event.issue.user.login == 'vanya890'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate shared-memory credential
        env:
          AGENT_SHARED_MEMORY_TOKEN: ${{ secrets.AGENT_SHARED_MEMORY_TOKEN }}
        run: |
          if [ -z "$AGENT_SHARED_MEMORY_TOKEN" ]; then
            echo "::error::Add AGENT_SHARED_MEMORY_TOKEN with Contents read/write access to vanya890/AgentSharedMemory."
            exit 1
          fi

      - name: Checkout private runtime storage
        uses: actions/checkout@v4
        with:
          repository: vanya890/AgentSharedMemory
          ref: aifriend-runtime
          path: AgentSharedMemory
          token: ${{ secrets.AGENT_SHARED_MEMORY_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate private command reference
        id: command
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            let payload;
            try {
              payload = JSON.parse(issue.body || '');
            } catch {
              throw new Error('Issue body must contain one JSON command reference');
            }
            if (!payload || typeof payload !== 'object' || Array.isArray(payload) ||
                payload.action !== 'execute_private_command' ||
                typeof payload.command_id !== 'string' ||
                !/^[A-Za-z0-9_-]{1,100}$/.test(payload.command_id)) {
              throw new Error('Expected execute_private_command with a valid command_id');
            }
            core.setOutput('command_id', payload.command_id);

      - name: Execute command and record confirmed bot reply
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          AIFRIEND_COMMAND_ID: ${{ steps.command.outputs.command_id }}
          AIFRIEND_COMMAND_DIR: AgentSharedMemory/temporary/aifriend/commands
          AIFRIEND_CONTEXT_DIR: AgentSharedMemory/temporary/aifriend/chats
        run: node src/execute-private-command.js

      - name: Persist private command result and chat context
        run: |
          git -C AgentSharedMemory add temporary/aifriend/chats/ temporary/aifriend/commands/
          if git -C AgentSharedMemory diff --cached --quiet; then
            echo "No private runtime changes."
          else
            git -C AgentSharedMemory config user.name "github-actions[bot]"
            git -C AgentSharedMemory config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C AgentSharedMemory commit -m "chore: record AIFriend command result"
            git -C AgentSharedMemory push origin HEAD:aifriend-runtime
          fi

      - name: Confirm delivery without exposing private data
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: 'Telegram message delivered and recorded in private chat context.'
            });
