name: ChatGPT Telegram Command Bridge

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

concurrency:
  group: aifriend-runtime-context
  cancel-in-progress: false

jobs:
  execute:
    if: startsWith(github.event.issue.title, '[aifriend]') && github.event.issue.user.login == 'vanya890'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate shared-memory credential
        env:
          AGENT_SHARED_MEMORY_TOKEN: ${{ secrets.AGENT_SHARED_MEMORY_TOKEN }}
        run: |
          if [ -z "$AGENT_SHARED_MEMORY_TOKEN" ]; then
            echo "::error::Add AGENT_SHARED_MEMORY_TOKEN with Contents read/write access to vanya890/AgentSharedMemory."
            exit 1
          fi

      - name: Checkout private runtime storage
        uses: actions/checkout@v4
        with:
          repository: vanya890/AgentSharedMemory
          ref: aifriend-runtime
          path: AgentSharedMemory
          token: ${{ secrets.AGENT_SHARED_MEMORY_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and send Telegram command
        id: send
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        with:
          script: |
            const issue = context.payload.issue;
            const token = process.env.TELEGRAM_BOT_TOKEN;
            if (!token) throw new Error('Missing TELEGRAM_BOT_TOKEN secret');

            let command;
            try {
              command = JSON.parse(issue.body || '');
            } catch {
              throw new Error('Issue body must contain one JSON object');
            }

            if (!command || typeof command !== 'object' || Array.isArray(command)) {
              throw new Error('Command must be a JSON object');
            }
            if (command.action !== 'send_message') {
              throw new Error('Only send_message is allowed');
            }
            if (!Number.isSafeInteger(Number(command.chat_id))) {
              throw new Error('chat_id must be a numeric Telegram chat ID');
            }
            if (typeof command.text !== 'string' || !command.text.trim() || command.text.length > 4096) {
              throw new Error('text must contain 1..4096 characters');
            }
            if (command.reply_to_message_id != null && !Number.isSafeInteger(Number(command.reply_to_message_id))) {
              throw new Error('reply_to_message_id must be numeric');
            }

            const payload = { chat_id: Number(command.chat_id), text: command.text };
            if (command.reply_to_message_id != null) {
              payload.reply_parameters = {
                message_id: Number(command.reply_to_message_id),
                allow_sending_without_reply: false
              };
            }

            const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(payload)
            });
            const result = await response.json();
            if (!response.ok || !result.ok) {
              throw new Error(`Telegram sendMessage failed: ${result.description || response.status}`);
            }

            core.setOutput('chat_id', String(payload.chat_id));
            core.setOutput('message_id', String(result.result.message_id));
            core.setOutput('date', String(result.result.date));
            core.setOutput('text', command.text);
            core.setOutput('reply_to_message_id', command.reply_to_message_id == null ? '' : String(command.reply_to_message_id));

      - name: Record confirmed bot reply in private context
        env:
          AIFRIEND_CONTEXT_DIR: AgentSharedMemory/temporary/aifriend/chats
          AIFRIEND_CHAT_ID: ${{ steps.send.outputs.chat_id }}
          AIFRIEND_MESSAGE_ID: ${{ steps.send.outputs.message_id }}
          AIFRIEND_DATE: ${{ steps.send.outputs.date }}
          AIFRIEND_TEXT: ${{ steps.send.outputs.text }}
          AIFRIEND_REPLY_TO_MESSAGE_ID: ${{ steps.send.outputs.reply_to_message_id }}
        run: node src/record-bot-reply.js

      - name: Persist private chat context
        run: |
          git -C AgentSharedMemory add temporary/aifriend/chats/
          if git -C AgentSharedMemory diff --cached --quiet; then
            echo "No context changes to persist."
          else
            git -C AgentSharedMemory config user.name "github-actions[bot]"
            git -C AgentSharedMemory config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C AgentSharedMemory commit -m "chore: record AIFriend bot reply"
            git -C AgentSharedMemory push origin HEAD:aifriend-runtime
          fi

      - name: Confirm delivery and context persistence
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `Telegram message sent and added to private chat context. Chat ID: ${{ steps.send.outputs.chat_id }}; message ID: ${{ steps.send.outputs.message_id }}.`
            });
