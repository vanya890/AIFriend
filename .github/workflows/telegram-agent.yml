name: Telegram Inbox Collector

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-inbox-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect Telegram updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          npm run check
          npm test
          npm start

      - name: Upload temporary Telegram images\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: telegram-media-${{ github.run_id }}\n          path: /tmp/aifriend-media/\n          if-no-files-found: ignore\n          retention-days: 1\n\n      - name: Persist inbox and memory
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No new Telegram updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: collect Telegram inbox"
          git push origin HEAD:main
