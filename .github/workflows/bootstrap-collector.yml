name: Bootstrap Telegram Collector (one-time push trigger)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-collector.yml"

permissions:
  contents: write

concurrency:
  group: telegram-inbox-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and test
        run: |
          npm run check
          npm test

      - name: Collect Telegram updates
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: npm start

      - name: Persist collector state
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No new Telegram updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: collect Telegram inbox"
          git push origin HEAD:main
